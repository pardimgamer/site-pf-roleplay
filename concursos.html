<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editais - PF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS EMBUTIDO PARA NÃO BUGAR MAIS */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .btn-voltar { background: none; border: 1px solid #f1c40f; color: #f1c40f; padding: 10px 20px; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; margin-bottom: 30px; }
        .title-gold { border-left: 5px solid #f1c40f; padding-left: 15px; color: #f1c40f; margin: 20px 0; }
        .req-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .req-item { background: #111; padding: 20px; border-radius: 8px; border: 1px solid #222; text-align: center; }
        .req-item i { color: #f1c40f; font-size: 24px; margin-bottom: 10px; }
        .vagas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #fff; color: #000; padding: 25px; border-radius: 12px; border-top: 5px solid #f1c40f; }
        .card.closed { filter: grayscale(1); opacity: 0.6; }
        .badge { background: #f1c40f; padding: 5px 10px; font-weight: 900; font-size: 12px; display: inline-block; margin-bottom: 10px; }
        .btn-go { width: 100%; background: #000; color: #fff; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; text-decoration: none; display: block; text-align: center; }
        .btn-off { width: 100%; background: #ccc; color: #888; padding: 12px; border: none; border-radius: 5px; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
        
        <h2 class="title-gold">REQUISITOS</h2>
        <div class="req-grid">
            <div class="req-item"><i class="fas fa-user-shield"></i><h4>Nacionalidade</h4><p>Brasileiro nato.</p></div>
            <div class="req-item"><i class="fas fa-id-card"></i><h4>Habilitação</h4><p>CNH Categoria B.</p></div>
        </div>

        <h2 class="title-gold">EDITAIS</h2>
        <div class="vagas-grid">
            <div class="card">
                <span class="badge">AGENTE</span>
                <h3>Agente de Polícia Federal</h3>
                <p>285 vagas disponíveis</p>
                <a href="prova.html" class="btn-go">INICIAR PROVA</a>
            </div>
            <div class="card closed">
                <span class="badge">DELEGADO</span>
                <h3>Delegado de Polícia Federal</h3>
                <p>Inscrições encerradas.</p>
                <div class="btn-off">FECHADO</div>
            </div>
        </div>
    </div>
</body>
</html>
